# Agent Foundry Default Configuration

# VM Resource Defaults
# CPU cores per VM (null = 50% of host cores)
DEFAULT_CPUS=

# Memory per VM in MB
DEFAULT_MEMORY=8192

# Disk size per VM in GB
DEFAULT_DISK=20

# Networking
# Gateway IP for host
GATEWAY_IP=172.16.0.1

# VM IP range start
IP_RANGE_START=172.16.0.10

# VM IP range end
IP_RANGE_END=172.16.0.254

# Host network interface (auto-detect if empty)
HOST_INTERFACE=

# Paths
# Template storage directory
TEMPLATE_DIR="${HOME}/.local/share/foundry/vms/templates"

# Instance storage directory
INSTANCE_DIR="${HOME}/.local/share/foundry/vms/instances"

# Kernel storage directory
KERNEL_DIR="${HOME}/.local/share/foundry/vms/kernels"

# Log directory
LOG_DIR="${HOME}/.local/share/foundry/logs"

# Config directory
CONFIG_DIR="${HOME}/.config/foundry"

# Agent Defaults
# Default agent type (ralph-claude-code, claude-code, gemini-cli, openai-codex)
DEFAULT_AGENT_TYPE=ralph-claude-code

# SSH
# Default SSH key for git authentication
SSH_KEY="${HOME}/.ssh/id_rsa"

# SSH connection timeout in seconds
SSH_TIMEOUT=10

# Firecracker
# Firecracker binary path (auto-detect if empty)
FIRECRACKER_BIN=

# Firecracker log level (Debug, Info, Warning, Error)
FIRECRACKER_LOG_LEVEL=Info

# VM boot timeout in seconds
VM_BOOT_TIMEOUT=30

# Misc
# Enable colored output (true/false)
COLOR_OUTPUT=true

# Verbose logging (true/false)
VERBOSE=false

# Confirm destructive operations (true/false)
CONFIRM_DESTROY=true
