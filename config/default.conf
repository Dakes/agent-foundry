# Agent Foundry Default Configuration
#
# Host-wide defaults. Anything here can be overridden per project in the
# project's foundry.json, which is the preferred place for project settings.

# Sandbox Resource Defaults
# CPU cores per sandbox (empty = let Docker Sandboxes decide: all host CPUs)
DEFAULT_CPUS=

# Memory per sandbox in MB (empty = 50% of host memory, capped at 32 GiB)
#
# 4 GiB is the floor for an agent that builds and tests: the CLI itself sits
# around 0.5-1.2 GB during a run, the nested Docker daemon takes ~160 MB, and
# there is no swap - what is left over is what a compiler or test suite gets.
# Raise it per project in foundry.json (.resources.memory) rather than here
# when only one project needs more.
DEFAULT_MEMORY=4096

# Agent Defaults
# Agent started by 'foundry up' when a project does not set .agent
# Allowed values: claude, gemini, codex, ralph, ralph-orchestrator, kimi-ralph
FOUNDRY_DEFAULT_AGENT=claude

# Image repository for the agent image built by 'foundry image build'
FOUNDRY_IMAGE_REPO=foundry-agent

# Paths
# Volume roots, one directory per project (empty = ~/.local/share/foundry/volumes)
FOUNDRY_VOLUME_DIR=

# Shared read-only context mounted into every sandbox
# (empty = ~/.local/share/foundry/shared)
FOUNDRY_SHARED_DIR=

# Network
# Ranges denied to every sandbox. The default denies home/office LAN space and
# the cloud metadata endpoint, and leaves the rest of RFC1918 reachable because
# container networking lives there - denying the range holding a sandbox's own
# DNS resolver breaks name resolution outright.
# FOUNDRY_PRIVATE_RANGES=("192.168.0.0/16" "169.254.0.0/16")

# Misc
# Enable colored output (true/false)
COLOR_OUTPUT=true

# Verbose logging (true/false)
VERBOSE=false

# Confirm destructive operations (true/false)
CONFIRM_DESTROY=true
