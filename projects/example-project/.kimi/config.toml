# Kimi Code CLI configuration for the example project.
# This file is synced to /root/.kimi/config.toml inside the VM.
#
# Authentication:
#   1. Set the API key below (from https://platform.moonshot.cn/ or platform.kimi.com).
#   2. OR run `kimi login` once inside the VM and authenticate interactively.

default_model = "kimi-code/kimi-for-coding"
default_thinking = true
skip_afk_prompt_injection = false

[providers."managed:kimi-code"]
type = "kimi"
base_url = "https://api.kimi.com/coding/v1"
# Replace with your Moonshot API key, or leave empty and use `kimi login`.
api_key = ""

[loop_control]
max_steps_per_turn = 1000
max_retries_per_step = 3
# Kimi Code CLI (kimi-code) handles loop limits internally.
max_ralph_iterations = 0
